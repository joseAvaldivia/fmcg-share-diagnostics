[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcg-share-diagnostics"
version = "1.0.0"
description = "Diagnóstico de pérdida de share, episodios de precio y tácticas de portafolio (TPO) para consumo masivo — datos sintéticos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "h3>=4.0",
    "matplotlib>=3.8",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
